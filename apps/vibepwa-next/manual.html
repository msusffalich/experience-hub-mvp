<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Manual de usuario · VibePWA 2</title>
  <style>
    :root {
      --manual-bg: #f4f6f5;
      --manual-surface: #ffffff;
      --manual-text: #17211e;
      --manual-muted: #596863;
      --manual-line: #dbe2df;
      --manual-accent: #087a64;
      --manual-accent-soft: #e5f4ef;
      --manual-warm: #fff5df;
      --manual-warm-line: #ead39f;
      --manual-shadow: 0 14px 38px rgba(30, 52, 45, .08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --manual-bg: #111715;
        --manual-surface: #18211e;
        --manual-text: #f0f5f3;
        --manual-muted: #b5c2bd;
        --manual-line: #34413d;
        --manual-accent: #6ed8bd;
        --manual-accent-soft: #203f37;
        --manual-warm: #3a3222;
        --manual-warm-line: #6f5b31;
        --manual-shadow: none;
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--manual-bg);
      color: var(--manual-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, select, input { font: inherit; }
    .manual-shell { min-height: 100vh; }
    .manual-hero {
      background: var(--manual-surface);
      border-bottom: 1px solid var(--manual-line);
    }
    .manual-hero-inner {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 38px 0 30px;
    }
    .manual-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 30px;
    }
    .manual-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--manual-text);
      font-weight: 750;
      text-decoration: none;
    }
    .manual-brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: #087a64;
      font-size: 18px;
      font-weight: 800;
    }
    .manual-actions {
      display: flex;
      align-items: end;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }
    .manual-field {
      display: grid;
      gap: 5px;
      color: var(--manual-muted);
      font-size: 12px;
      font-weight: 700;
    }
    .manual-field select,
    .manual-search input {
      min-height: 42px;
      border: 1px solid var(--manual-line);
      border-radius: 7px;
      color: var(--manual-text);
      background: var(--manual-surface);
      padding: 0 12px;
    }
    .manual-button {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--manual-line);
      border-radius: 7px;
      color: var(--manual-text);
      background: var(--manual-surface);
      padding: 0 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .manual-button.primary {
      border-color: #087a64;
      color: #fff;
      background: #087a64;
    }
    .manual-eyebrow {
      margin: 0 0 8px;
      color: var(--manual-accent);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    .manual-hero h1 {
      max-width: 820px;
      margin: 0;
      font-size: clamp(34px, 6vw, 58px);
      line-height: 1.04;
      letter-spacing: 0;
    }
    .manual-subtitle {
      max-width: 790px;
      margin: 16px 0 0;
      color: var(--manual-muted);
      font-size: 18px;
      line-height: 1.6;
    }
    .manual-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .manual-meta span {
      border: 1px solid var(--manual-line);
      border-radius: 6px;
      color: var(--manual-muted);
      background: var(--manual-bg);
      padding: 7px 10px;
      font-size: 13px;
      font-weight: 650;
    }
    .manual-layout {
      display: grid;
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0 90px;
      grid-template-columns: 270px minmax(0, 1fr);
      gap: 36px;
      align-items: start;
    }
    .manual-sidebar {
      position: sticky;
      top: 20px;
      display: grid;
      gap: 18px;
    }
    .manual-search {
      display: grid;
      gap: 7px;
    }
    .manual-search label {
      color: var(--manual-muted);
      font-size: 12px;
      font-weight: 750;
    }
    .manual-toc {
      overflow: hidden;
      border: 1px solid var(--manual-line);
      border-radius: 8px;
      background: var(--manual-surface);
    }
    .manual-toc-title {
      margin: 0;
      padding: 15px 16px 10px;
      font-size: 13px;
    }
    .manual-toc nav { padding: 0 8px 10px; }
    .manual-toc a {
      display: block;
      border-left: 3px solid transparent;
      border-radius: 4px;
      color: var(--manual-muted);
      padding: 9px 10px;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.35;
      text-decoration: none;
    }
    .manual-toc a:hover,
    .manual-toc a[aria-current="true"] {
      border-left-color: var(--manual-accent);
      color: var(--manual-text);
      background: var(--manual-accent-soft);
    }
    .manual-main { min-width: 0; }
    .manual-quick {
      display: grid;
      margin-bottom: 24px;
      border: 1px solid var(--manual-line);
      border-radius: 8px;
      background: var(--manual-surface);
      box-shadow: var(--manual-shadow);
      padding: 24px;
      gap: 16px;
    }
    .manual-quick h2 { margin: 0; font-size: 22px; }
    .manual-path {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      counter-reset: quickstep;
    }
    .manual-path-item {
      position: relative;
      min-height: 108px;
      border: 1px solid var(--manual-line);
      border-radius: 7px;
      background: var(--manual-bg);
      padding: 40px 14px 14px;
      counter-increment: quickstep;
    }
    .manual-path-item::before {
      position: absolute;
      top: 12px;
      left: 14px;
      display: grid;
      width: 23px;
      height: 23px;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: #087a64;
      content: counter(quickstep);
      font-size: 12px;
      font-weight: 800;
    }
    .manual-path-item strong { display: block; margin-bottom: 5px; }
    .manual-path-item span { color: var(--manual-muted); font-size: 13px; line-height: 1.45; }
    .manual-chapter {
      scroll-margin-top: 22px;
      margin-bottom: 24px;
      border: 1px solid var(--manual-line);
      border-radius: 8px;
      background: var(--manual-surface);
      box-shadow: var(--manual-shadow);
      padding: 30px;
    }
    .manual-chapter.operation {
      border-color: var(--manual-warm-line);
      background: var(--manual-warm);
    }
    .manual-chapter-number {
      margin: 0 0 8px;
      color: var(--manual-accent);
      font-size: 13px;
      font-weight: 800;
    }
    .manual-chapter h2 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
    }
    .manual-chapter-lead {
      max-width: 760px;
      margin: 12px 0 0;
      color: var(--manual-muted);
      font-size: 16px;
      line-height: 1.65;
    }
    .manual-section {
      margin-top: 26px;
      padding-top: 24px;
      border-top: 1px solid var(--manual-line);
    }
    .manual-section:first-of-type { margin-top: 24px; }
    .manual-section h3 {
      margin: 0 0 10px;
      font-size: 19px;
      line-height: 1.3;
    }
    .manual-section p,
    .manual-section li {
      color: var(--manual-muted);
      line-height: 1.65;
    }
    .manual-section p { margin: 8px 0; }
    .manual-section ol,
    .manual-section ul {
      margin: 12px 0 0;
      padding-left: 22px;
    }
    .manual-section li + li { margin-top: 7px; }
    .manual-note {
      margin-top: 16px;
      border-left: 4px solid var(--manual-accent);
      border-radius: 4px;
      color: var(--manual-text);
      background: var(--manual-accent-soft);
      padding: 13px 15px;
      line-height: 1.55;
    }
    .manual-empty {
      display: none;
      border: 1px dashed var(--manual-line);
      border-radius: 8px;
      color: var(--manual-muted);
      background: var(--manual-surface);
      padding: 30px;
      text-align: center;
    }
    .manual-footer {
      margin-top: 30px;
      color: var(--manual-muted);
      font-size: 13px;
      text-align: center;
    }
    @media (max-width: 850px) {
      .manual-toolbar { align-items: flex-start; }
      .manual-actions { justify-content: flex-start; }
      .manual-layout { grid-template-columns: 1fr; }
      .manual-sidebar { position: static; }
      .manual-toc nav {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .manual-path { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 560px) {
      .manual-hero-inner,
      .manual-layout { width: min(100% - 24px, 1180px); }
      .manual-toolbar,
      .manual-actions { align-items: stretch; flex-direction: column; }
      .manual-actions > * { width: 100%; }
      .manual-field select { width: 100%; }
      .manual-toc nav,
      .manual-path { grid-template-columns: 1fr; }
      .manual-chapter,
      .manual-quick { padding: 21px 18px; }
      .manual-chapter h2 { font-size: 24px; }
    }
    @page { size: A4; margin: 14mm 15mm 16mm; }
    @media print {
      :root {
        --manual-bg: #fff;
        --manual-surface: #fff;
        --manual-text: #111;
        --manual-muted: #333;
        --manual-line: #c9cecc;
        --manual-accent: #075f50;
        --manual-accent-soft: #edf6f3;
        --manual-warm: #fffaf0;
        --manual-warm-line: #dccaa2;
        --manual-shadow: none;
      }
      body { background: #fff; font-size: 10.5pt; }
      .manual-toolbar,
      .manual-sidebar { display: none !important; }
      .manual-hero { border: 0; }
      .manual-hero-inner,
      .manual-layout { width: 100%; margin: 0; padding: 0; }
      .manual-layout { display: block; }
      .manual-hero-inner { padding-bottom: 10mm; }
      .manual-hero h1 { font-size: 28pt; }
      .manual-subtitle { font-size: 12pt; }
      .manual-main { display: block; }
      .manual-quick,
      .manual-chapter {
        box-shadow: none;
        break-inside: auto;
        margin-bottom: 8mm;
      }
      .manual-chapter { page-break-before: auto; }
      .manual-chapter h2,
      .manual-section h3 { break-after: avoid; }
      .manual-section,
      .manual-note,
      .manual-path-item { break-inside: avoid; }
      .manual-footer { margin-top: 8mm; }
      a { color: inherit; text-decoration: none; }
    }
  </style>
</head>
<body>
  <main id="manual" class="manual-shell" aria-live="polite"></main>
  <script type="module" src="./src/manual.js"></script>
</body>
</html>
