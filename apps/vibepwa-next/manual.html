<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Manual Vibe</title>
  <style>
    .manual{width:min(860px,100%);margin:0 auto;padding:44px 22px 90px}
    .manual header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-bottom:24px;border-bottom:1px solid var(--line)}
    .manual h1{margin:0;font-size:38px}.manual h2{margin:36px 0 12px;font-size:24px}.manual h3{margin:24px 0 8px}
    .manual p,.manual li{line-height:1.65;color:var(--muted)}.manual table{width:100%;border-collapse:collapse}
    .manual th,.manual td{padding:10px;text-align:left;border-bottom:1px solid var(--line)}
    @media print{.manual{width:100%;padding:0}.manual header>div:last-child{display:none}.manual section{break-inside:avoid}.manual h2{margin-top:24px}}
  </style>
</head>
<body>
  <main id="manual" class="manual"></main>
  <script type="module" src="./src/manual.js"></script>
</body>
</html>
